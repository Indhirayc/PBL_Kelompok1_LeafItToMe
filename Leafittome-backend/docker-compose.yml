services:
  db:
    image: mysql:8.0
    container_name: leafittome_mysql
    restart: always
    environment:
      MYSQL_DATABASE: leafittome
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  web:
    build: .
    container_name: leafittome_api
    restart: always
    ports:
      - "8081:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db

  phpmyadmin:
    image: phpmyadmin
    container_name: leafittome_pma
    restart: always
    ports:
      - "8083:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

volumes:
  mysql_data:
