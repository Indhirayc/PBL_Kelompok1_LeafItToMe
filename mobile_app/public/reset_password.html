<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeafItToMe - Reset Kata Sandi</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f6f8;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }

    .card {
      background: white;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .brand {
      color: #2e7d32;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .sub {
      color: #666;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 16px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #333;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
    }

    input:focus {
      outline: none;
      border-color: #2e7d32;
    }

    button {
      width: 100%;
      background: #2e7d32;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
      font-size: 15px;
      margin-top: 8px;
    }

    button:hover {
      background: #1b5e20;
    }

    #message {
      margin-top: 16px;
      font-size: 14px;
      font-weight: 500;
    }

    .success {
      color: #2e7d32;
    }

    .error {
      color: #d32f2f;
    }
  </style>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>

<body>

  <div class="card">
    <div class="brand">🌿 LeafItToMe</div>
    <div class="sub">Atur Ulang Kata Sandi Akun Anda</div>

    <div id="formSection">
      <div class="form-group">
        <label for="newPassword">Kata Sandi Baru</label>
        <input type="password" id="newPassword" placeholder="Minimal 8 karakter" />
      </div>

      <button id="btnSubmit" onclick="handleReset()">Perbarui Kata Sandi</button>
    </div>

    <div id="message"></div>
  </div>

  <script>
    // Konfigurasi Firebase dari firebase_options.dart
    const firebaseConfig = {
      apiKey: "AIzaSyAwKoxq_lAY7crDLD-QKSh8jTW6FIEtpXI",
      authDomain: "leafittome-e91ed.firebaseapp.com",
      projectId: "leafittome-e91ed"
    };
    firebase.initializeApp(firebaseConfig);

    const urlParams = new URLSearchParams(window.location.search);
    const actionCode = urlParams.get('oobCode');

    // Validasi token oobCode saat halaman dibuka
    const formSection = document.getElementById('formSection');
    const msgBox = document.getElementById('message');

    if (!actionCode) {
      if (formSection) formSection.style.display = 'none';
      msgBox.className = 'error';
      msgBox.innerText = 'Tautan tidak valid atau tidak memiliki kode pemulihan.';
    } else {
      firebase.auth().verifyPasswordResetCode(actionCode)
        .then((email) => {
          const subText = document.querySelector('.sub');
          if (subText) subText.innerText = 'Atur ulang kata sandi untuk ' + email;
        })
        .catch((err) => {
          if (formSection) formSection.style.display = 'none';
          msgBox.className = 'error';
          msgBox.innerText = 'Tautan tidak valid atau telah kedaluwarsa. Silakan minta tautan baru dari aplikasi.';
        });
    }

    async function handleReset() {
      const newPassword = document.getElementById('newPassword').value;

      if (!actionCode) {
        msgBox.className = 'error';
        msgBox.innerText = 'Tautan tidak valid atau telah kedaluwarsa.';
        return;
      }

      if (newPassword.length < 8) {
        msgBox.className = 'error';
        msgBox.innerText = 'Kata sandi minimal 8 karakter!';
        return;
      }

      const btnSubmit = document.getElementById('btnSubmit');
      btnSubmit.disabled = true;
      btnSubmit.innerText = 'Memperbarui...';

      try {
        await firebase.auth().confirmPasswordReset(actionCode, newPassword);
        msgBox.className = 'success';
        msgBox.innerText = 'Kata sandi berhasil diubah! Silakan buka kembali aplikasi LeafItToMe.';
        if (formSection) formSection.style.display = 'none';
      } catch (err) {
        btnSubmit.disabled = false;
        btnSubmit.innerText = 'Perbarui Kata Sandi';
        msgBox.className = 'error';
        msgBox.innerText = 'Gagal mereset: ' + err.message;
      }
    }
  </script>
</body>

</html>
